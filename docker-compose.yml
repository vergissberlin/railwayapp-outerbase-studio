version: '3.6'

services:
  outerbase-studio:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: outerbase-studio-development
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - STUDIO_USER=${STUDIO_USER}
      - STUDIO_PASSWORD=${STUDIO_PASSWORD}
    ports:
      - 3000:3000
    volumes:
      - ./data/outerbase-studio:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
